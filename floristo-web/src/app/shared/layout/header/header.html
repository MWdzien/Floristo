<header class="site-header">
    <nav class="site-header__nav">
        @for (category of topLevelCategories(); track category.slug) {
            <a [routerLink]="['/kategoria', category.slug]" class="site-header__link">
                {{ category.name }}
            </a>
        }
    </nav>

    <a [routerLink]="['/']" class="site-header__logo">
        <img src="/logo.png" alt="Floristo">
    </a>

    <div class="site-header__actions">
        <button type="button" class="site-header__action" aria-label="Szukaj">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21 21-4.34-4.34"/>
                <circle cx="11" cy="11" r="8"/>
            </svg>
        </button>

        <a [routerLink]="['/konto']" class="site-header__action" aria-label="Konto">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="5"/>
                <path d="M20 21a8 8 0 0 0-16 0"/>
            </svg>
        </a>

        <a [routerLink]="['/koszyk']" class="site-header__action" aria-label="Koszyk">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 10a4 4 0 0 1-8 0"/>
                <path d="M3.103 6.034h17.794"/>
                <path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/>
            </svg>
        </a>

        <button class="hamburger" (click)="toggleMenu()" type="button" aria-label="Menu" [attr.aria-expanded]="menuOpen()">
            @if (menuOpen()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-x-icon lucide-x">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                </svg>
            } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="lucide lucide-menu-icon lucide-menu">
                    <path d="M4 5h16"/>
                    <path d="M4 12h16"/>
                    <path d="M4 19h16"/>
                </svg>
            }
        </button>

        <div class="menu" [class.open]="menuOpen()">
            <nav class="menu-nav">
                @for (category of topLevelCategories(); track category.slug) {
                    <a [routerLink]="['/kategoria', category.slug]" class="site-header__link" (click)="closeMenu()">
                        {{ category.name }}
                    </a>
                }
            </nav>
        </div>
    </div>
</header>
